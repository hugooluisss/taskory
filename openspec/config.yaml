schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Architecture (mandatory, every app): controller -> service -> repository.
  - Backend: controller attends the request (parse/validate input, call one
    service, shape the response); service holds business rules; repository is
    the only layer that touches the database. No business rules in controllers,
    no data access outside repositories, no controller->repository calls.
  - Frontend (Angular): controller = component/page class that controls the
    view (state, events, no HTTP, no business rules); service = business and
    view-independent rules; repository = the only layer that talks to the HTTP
    API. Components never call HttpClient.
  - MCP: tool handler = controller, service = rules, repository = REST client
    of the Taskory API.
  - packages/llm: ReportGenerator = service, providers = repositories.

rules:
  design:
    - Must state how the change maps to controller -> service -> repository.
  tasks:
    - Group tasks per layer (repository, service, controller) and include tests per layer.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
