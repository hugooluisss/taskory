services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_PATH: /data/taskory.sqlite
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-ollama}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-llama3.2}
    volumes:
      - taskory-data:/data
    networks:
      - taskory
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3100
      TASKORY_API_URL: http://api:3000/api/v1
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taskory
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - taskory
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - taskory
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    entrypoint: ["ollama", "pull", "${DEFAULT_LLM_MODEL:-llama3.2}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - taskory
    restart: "no"

networks:
  taskory:

volumes:
  taskory-data:
    name: taskory-data
  ollama-data:
