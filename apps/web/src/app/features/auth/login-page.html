<main class="auth">
  <app-language-switcher />
  <section class="card">
    <h1>{{ 'auth.loginTitle' | transloco }}</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email">{{ 'auth.email' | transloco }}</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" required />
      <small aria-live="polite" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        {{ 'auth.emailInvalid' | transloco }}
      </small>
      <label for="password">{{ 'auth.password' | transloco }}</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />
      <small
        aria-live="polite"
        *ngIf="form.controls.password.touched && form.controls.password.invalid"
      >
        {{ 'auth.required' | transloco }}
      </small>
      <p role="alert" *ngIf="errorKey()">{{ errorKey() | transloco }}</p>
      <button type="submit" [disabled]="loading()">
        {{ (loading() ? 'common.loading' : 'auth.login') | transloco }}
      </button>
    </form>
  </section>
</main>
