<main class="min-h-screen bg-base-200 px-4 py-8">
  <section class="card mx-auto mt-8 w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body gap-5 p-6 sm:p-8">
      <span class="text-primary text-sm font-semibold tracking-wide">{{
        'auth.brand' | transloco
      }}</span>
      <h1 class="card-title text-2xl">{{ 'auth.loginTitle' | transloco }}</h1>
      <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-control w-full"
          ><span class="label-text mb-1">{{ 'auth.email' | transloco }}</span>
          <input
            class="input input-bordered w-full"
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
          />
          <small
            class="text-error"
            aria-live="polite"
            *ngIf="form.controls.email.touched && form.controls.email.invalid"
            >{{ 'auth.emailInvalid' | transloco }}</small
          >
        </label>
        <label class="form-control w-full"
          ><span class="label-text mb-1">{{ 'auth.password' | transloco }}</span>
          <span class="join w-full"
            ><input
              class="input input-bordered join-item w-full"
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              required /><button
              class="btn btn-outline join-item"
              type="button"
              [attr.aria-label]="
                (showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | transloco
              "
              (click)="showPassword.set(!showPassword())"
            >
              <app-icon [name]="showPassword() ? 'eyeOff' : 'eye'" /></button
          ></span>
          <small
            class="text-error"
            aria-live="polite"
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
            >{{ 'auth.required' | transloco }}</small
          >
        </label>
        <p class="text-error" role="alert" *ngIf="errorKey()">{{ errorKey() | transloco }}</p>
        <button class="btn btn-primary w-full" type="submit" [disabled]="loading()">
          {{ (loading() ? 'common.loading' : 'auth.login') | transloco }}
        </button>
      </form>
      <a
        class="link link-primary text-sm"
        routerLink="/register"
        [queryParams]="{ returnUrl: returnUrl }"
        >{{ 'auth.registerLink' | transloco }}</a
      >
    </div>
  </section>
</main>
