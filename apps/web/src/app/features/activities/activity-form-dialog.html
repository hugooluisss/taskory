<dialog
  #dialog
  class="modal"
  aria-labelledby="activity-form-title"
  (cancel)="$event.preventDefault(); close()"
>
  <div class="modal-box max-h-[90vh] max-w-2xl overflow-y-auto">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <h2 class="text-2xl font-semibold" id="activity-form-title">
        {{ (currentId() ? 'activities.editActivity' : 'activities.newActivity') | transloco }}
      </h2>
      <div class="mt-5 grid gap-4 sm:grid-cols-2">
        <label class="form-control"
          ><span class="label-text mb-1">{{ 'activities.date' | transloco }} *</span
          ><input
            class="input input-bordered"
            id="form-date"
            type="date"
            formControlName="date"
            [attr.aria-invalid]="dateError ? 'true' : null"
            aria-describedby="date-error"
          />
          @if (dateError) {
            <small id="date-error" class="text-error" aria-live="polite">{{
              'activities.required' | transloco
            }}</small>
          }
        </label>
        <label class="form-control"
          ><span class="label-text mb-1">{{ 'activities.title' | transloco }} *</span
          ><input
            class="input input-bordered"
            id="form-title"
            formControlName="title"
            maxlength="200"
            [attr.aria-invalid]="titleError ? 'true' : null"
            aria-describedby="title-error"
          />
          @if (titleError) {
            <small id="title-error" class="text-error" aria-live="polite">{{
              titleError | transloco
            }}</small>
          }
        </label>
        <app-project-selector
          class="sm:col-span-2"
          [projects]="projects()"
          [selectedIds]="selectedProjectIds()"
          (selectedIdsChange)="selectedProjectIds.set($event)"
        />
        <div class="sm:col-span-2">
          <app-textarea
            id="form-description"
            formControlName="description"
            [label]="'activities.description' | transloco"
          ></app-textarea>
        </div>
        <div class="sm:col-span-2">
          <app-chips-input
            id="form-tags"
            mode="tags"
            formControlName="tags"
            [label]="'activities.tags' | transloco"
          ></app-chips-input>
        </div>
        <div class="sm:col-span-2">
          <app-chips-input
            id="form-urls"
            mode="urls"
            formControlName="referenceUrls"
            [label]="'activities.referenceUrls' | transloco"
          ></app-chips-input>
        </div>
      </div>
      @if (error()) {
        <p class="alert alert-error mt-4" role="alert">
          <app-icon name="error" /><span>{{ error() | transloco }}</span>
        </p>
      }
      <div class="modal-action">
        <button class="btn btn-ghost" type="button" (click)="close()">
          <app-icon name="close" />{{ 'activities.cancel' | transloco }}</button
        ><button
          class="btn btn-primary"
          type="submit"
          [disabled]="saving()"
          [attr.aria-busy]="saving()"
        >
          @if (saving()) {
            <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
          } @else {
            <app-icon name="check" />
          }
          {{ 'activities.save' | transloco }}
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button
      [attr.aria-label]="'activities.closeDialog' | transloco"
      (click)="$event.preventDefault(); close()"
    >
      <app-icon name="close" />
    </button>
  </form>
</dialog>
