<dialog #dialog aria-labelledby="activity-form-title" (cancel)="$event.preventDefault(); close()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <h2 id="activity-form-title">
      {{ (currentId() ? 'activities.editActivity' : 'activities.newActivity') | transloco }}
    </h2>
    <label for="form-date">{{ 'activities.date' | transloco }} *</label>
    <input
      id="form-date"
      type="date"
      formControlName="date"
      [attr.aria-invalid]="dateError ? 'true' : null"
      aria-describedby="date-error"
    />
    @if (dateError) {
      <small id="date-error" aria-live="polite">{{ 'activities.required' | transloco }}</small>
    }
    <label for="form-title">{{ 'activities.title' | transloco }} *</label>
    <input
      id="form-title"
      formControlName="title"
      maxlength="200"
      [attr.aria-invalid]="titleError ? 'true' : null"
      aria-describedby="title-error"
    />
    @if (titleError) {
      <small id="title-error" aria-live="polite">{{ titleError | transloco }}</small>
    }
    <label for="form-project">{{ 'activities.project' | transloco }}</label>
    <input id="form-project" formControlName="project" list="form-projects" />
    <datalist id="form-projects">
      @for (suggestion of projects(); track suggestion) {
        <option [value]="suggestion"></option>
      }
    </datalist>
    <app-textarea
      id="form-description"
      formControlName="description"
      [label]="'activities.description' | transloco"
    ></app-textarea>
    <app-chips-input
      id="form-tags"
      mode="tags"
      formControlName="tags"
      [label]="'activities.tags' | transloco"
    ></app-chips-input>
    <app-chips-input
      id="form-urls"
      mode="urls"
      formControlName="referenceUrls"
      [label]="'activities.referenceUrls' | transloco"
    ></app-chips-input>
    @if (error()) {
      <p class="error" role="alert">{{ error() | transloco }}</p>
    }
    <div class="actions">
      <button type="button" class="cancel" (click)="close()">
        {{ 'activities.cancel' | transloco }}
      </button>
      <button type="submit" [disabled]="saving()" [attr.aria-busy]="saving()">
        {{ 'activities.save' | transloco }}
      </button>
    </div>
  </form>
</dialog>
