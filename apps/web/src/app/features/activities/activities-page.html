<main class="page">
  <app-page-header
    [title]="'activities.pageTitle' | transloco"
    [description]="'activities.pageDescription' | transloco"
    ><button class="btn btn-primary" type="button" (click)="create()">
      <app-icon name="add" />{{ 'activities.add' | transloco }}
    </button></app-page-header
  >
  <activities-filters-bar
    [projects]="projects()"
    (apply)="applyFilters($event)"
    (clear)="clearFilters()"
  ></activities-filters-bar>
  @if (error()) {
    <div class="alert alert-error" role="alert">
      <app-icon name="error" /><span>{{ error() | transloco }}</span>
      @if (error() === 'activities.loadError') {
        <button type="button" (click)="load()">{{ 'activities.retry' | transloco }}</button>
      }
    </div>
  }
  <activities-list
    [groups]="groups()"
    [loading]="loading()"
    [hasFilters]="hasFilters()"
    [totalCount]="total()"
    (edit)="edit($event)"
    (remove)="remove($event)"
  ></activities-list>
  @if (!loading() && total() > 0) {
    <app-pagination
      [page]="page()"
      [pages]="pages()"
      (pageChange)="changePage($event)"
    ></app-pagination>
  }
  <activities-form-dialog
    [projects]="projects()"
    (saveActivity)="save($event)"
  ></activities-form-dialog>
</main>
