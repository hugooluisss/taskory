<section class="filters" aria-label="{{ 'activities.filters' | transloco }}">
  <button
    class="mobile-toggle"
    type="button"
    [attr.aria-expanded]="expanded()"
    (click)="expanded.update((value) => !value)"
  >
    {{ 'activities.filters' | transloco }}
  </button>
  <form [class.expanded]="expanded()" (ngSubmit)="submit()">
    <label for="filter-from">{{ 'activities.from' | transloco }}</label>
    <input
      id="filter-from"
      name="from"
      type="date"
      [ngModel]="from()"
      (ngModelChange)="from.set($event)"
    />
    <label for="filter-to">{{ 'activities.to' | transloco }}</label>
    <input id="filter-to" name="to" type="date" [ngModel]="to()" (ngModelChange)="to.set($event)" />
    <label for="filter-project">{{ 'activities.project' | transloco }}</label>
    <select
      id="filter-project"
      name="project"
      [ngModel]="project()"
      (ngModelChange)="project.set($event)"
    >
      <option value="">{{ 'activities.allProjects' | transloco }}</option>
      @for (item of projects(); track item) {
        <option [value]="item">{{ item }}</option>
      }
    </select>
    <label for="filter-tag">{{ 'activities.tag' | transloco }}</label>
    <input id="filter-tag" name="tag" [ngModel]="tag()" (ngModelChange)="tag.set($event)" />
    <label for="filter-query">{{ 'activities.search' | transloco }}</label>
    <input id="filter-query" name="q" [ngModel]="q()" (ngModelChange)="q.set($event)" />
    <div class="actions">
      <button type="submit">{{ 'activities.applyFilters' | transloco }}</button>
      <button type="button" class="clear" (click)="reset()">
        {{ 'activities.clearFilters' | transloco }}
      </button>
    </div>
  </form>
</section>
