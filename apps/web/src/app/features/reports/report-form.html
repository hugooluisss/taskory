<form class="card mt-6 gap-5 bg-base-100 p-5 shadow sm:p-6" (ngSubmit)="submit()">
  <h2 class="text-xl font-semibold">{{ 'reports.form.title' | transloco }}</h2>
  <fieldset class="grid gap-3">
    <legend class="mb-2 font-medium">{{ 'reports.form.range' | transloco }}</legend>
    <div class="flex flex-wrap gap-2">
      <button class="btn btn-sm btn-outline" type="button" (click)="selectPreset('thisWeek')">
        {{ 'reports.form.thisWeek' | transloco }}</button
      ><button class="btn btn-sm btn-outline" type="button" (click)="selectPreset('lastWeek')">
        {{ 'reports.form.lastWeek' | transloco }}</button
      ><button class="btn btn-sm btn-outline" type="button" (click)="selectPreset('thisMonth')">
        {{ 'reports.form.thisMonth' | transloco }}</button
      ><button class="btn btn-sm btn-outline" type="button" (click)="selectPreset('lastMonth')">
        {{ 'reports.form.lastMonth' | transloco }}
      </button>
    </div>
  </fieldset>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="form-control gap-1"
      ><span>{{ 'reports.form.from' | transloco }}</span
      ><input
        class="input input-bordered w-full"
        type="date"
        name="from"
        [ngModel]="from()"
        (ngModelChange)="from.set($event)" /></label
    ><label class="form-control gap-1"
      ><span>{{ 'reports.form.to' | transloco }}</span
      ><input
        class="input input-bordered w-full"
        type="date"
        name="to"
        [ngModel]="to()"
        (ngModelChange)="to.set($event)"
    /></label>
  </div>
  @if (rangeError()) {
    <p class="text-error" role="alert">{{ 'reports.form.invalidRange' | transloco }}</p>
  }
  <app-chips-input
    name="projects"
    id="report-projects"
    [label]="'reports.form.projects' | transloco"
    [maxItems]="20"
    [maxLength]="100"
    [suggestions]="projects()"
    [ngModel]="selectedProjects()"
    (ngModelChange)="selectedProjects.set($event)"
  />
  @if (projectsUnavailable()) {
    <p class="text-base-content/70">{{ 'reports.form.projectsUnavailable' | transloco }}</p>
  }
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="form-control gap-1"
      ><span>{{ 'reports.form.language' | transloco }}</span
      ><select
        class="select select-bordered w-full"
        name="language"
        [ngModel]="language()"
        (ngModelChange)="language.set($event)"
      >
        <option value="es">{{ 'reports.form.spanish' | transloco }}</option>
        <option value="en">{{ 'reports.form.english' | transloco }}</option>
      </select></label
    ><label class="form-control gap-1"
      ><span>{{ 'reports.form.style' | transloco }}</span
      ><select
        class="select select-bordered w-full"
        name="style"
        [ngModel]="style()"
        (ngModelChange)="style.set($event)"
      >
        <option value="summary">{{ 'reports.form.summary' | transloco }}</option>
        <option value="detailed">{{ 'reports.form.detailed' | transloco }}</option>
      </select></label
    >
  </div>
  <app-button type="submit" [loading]="loading()">{{
    'reports.form.generate' | transloco
  }}</app-button>
</form>
