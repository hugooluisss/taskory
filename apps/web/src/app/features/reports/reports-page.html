<main class="mx-auto grid w-full max-w-5xl gap-5 px-4 py-6 sm:px-6">
  <app-page-header
    [title]="'reports.title' | transloco"
    [description]="'reports.description' | transloco"
  />
  <app-report-form (generate)="generate($event)" />
  @if (errorKey()) {
    <div class="alert alert-error mt-4">
      <app-icon name="error" /><span>{{ errorKey() | transloco }}</span>
    </div>
    @if (activeReportId()) {
      <button class="open-report btn btn-primary w-fit" type="button" (click)="openActiveReport()">
        {{ 'reports.errors.openActiveReport' | transloco }}
      </button>
    }
  }
  @if (job(); as currentJob) {
    <app-report-progress
      [job]="currentJob"
      [active]="currentJob.status === 'queued' || currentJob.status === 'running'"
      (retry)="retry()"
      (delete)="deleteJob()"
      (cancel)="deleteJob()"
    />
  }
  @if (result(); as report) {
    <app-report-result [report]="report" />
  }
</main>
