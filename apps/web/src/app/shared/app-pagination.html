<nav class="join flex justify-center py-6" [attr.aria-label]="'pagination.label' | transloco">
  <button
    class="btn join-item"
    type="button"
    [disabled]="page <= 1"
    (click)="pageChange.emit(page - 1)"
  >
    {{ 'pagination.previous' | transloco }}</button><span class="btn join-item pointer-events-none"
    >{{ page }} / {{ pages }}</span
  ><button
    class="btn join-item"
    type="button"
    [disabled]="page >= pages"
    (click)="pageChange.emit(page + 1)"
  >
    {{ 'pagination.next' | transloco }}
  </button>
</nav>
