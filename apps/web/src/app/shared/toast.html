<div class="toast-list" aria-live="polite">
  @for (message of toast.messages(); track message.id) {
    <div
      class="toast"
      [class.error]="message.kind === 'error'"
      [attr.role]="message.kind === 'error' ? 'alert' : 'status'"
    >
      <span>{{ message.message }}</span>
      <button
        type="button"
        [attr.aria-label]="'common.dismiss' | transloco"
        (click)="toast.dismiss(message.id)"
      >
        ×
      </button>
    </div>
  }
</div>
