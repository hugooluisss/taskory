<dialog
  role="dialog"
  aria-modal="true"
  #dialog
  aria-labelledby="confirm-title"
  (cancel)="cancel()"
  (click)="backdropClick($event)"
>
  @if (confirm.options(); as options) {
    <h2 id="confirm-title">{{ options.title }}</h2>
    <p>{{ options.message }}</p>
    <div class="actions">
      <button type="button" data-safe (click)="confirm.answer(false)">
        {{ options.cancelLabel }}
      </button>
      <button type="button" [class.danger]="options.danger" (click)="confirm.answer(true)">
        {{ options.confirmLabel }}
      </button>
    </div>
  }
</dialog>
