<dialog
  #dialog
  class="modal"
  aria-labelledby="confirm-title"
  (cancel)="cancel()"
  (click)="backdropClick($event)"
>
  <div class="modal-box">
    <h2 class="text-xl font-semibold" id="confirm-title">{{ confirm.options()?.title }}</h2>
    <p class="py-4">{{ confirm.options()?.message }}</p>
    <div class="modal-action">
      <button class="btn btn-ghost" type="button" data-safe (click)="confirm.answer(false)">
        {{ confirm.options()?.cancelLabel }}</button><button
        class="btn"
        [class.btn-error]="confirm.options()?.danger"
        type="button"
        (click)="confirm.answer(true)"
      >
        {{ confirm.options()?.confirmLabel }}
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button
      [attr.aria-label]="confirm.options()?.cancelLabel"
      (click)="$event.preventDefault(); cancel()"
    >
      <app-icon name="close" />
    </button>
  </form>
</dialog>
