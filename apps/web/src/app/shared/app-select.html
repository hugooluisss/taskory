<label [for]="id">
  {{ label }}
  @if (required) {
    <span aria-hidden="true">*</span>
  }
</label>
<select
  [id]="id"
  [value]="value"
  [required]="required"
  [disabled]="disabled"
  [attr.aria-invalid]="visibleError ? 'true' : null"
  [attr.aria-describedby]="describedBy"
  (change)="updateValue($event)"
  (blur)="markTouched()"
>
  <option value="" disabled>{{ placeholder }}</option>
  <ng-content />
</select>
@if (hint || visibleError) {
  <small [id]="id + '-help'" aria-live="polite">{{ visibleError || hint }}</small>
}
