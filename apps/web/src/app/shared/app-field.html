<label [for]="id">
  {{ label }}
  @if (required) {
    <span aria-hidden="true">*</span>
  }
</label>
<input
  [id]="id"
  [type]="type"
  [value]="value()"
  [required]="required"
  [disabled]="disabled()"
  [attr.aria-invalid]="visibleError ? 'true' : null"
  [attr.aria-describedby]="describedBy"
  (input)="updateValue($event)"
  (blur)="markTouched()"
/>
@if (hint || visibleError) {
  <small [id]="id + '-help'" aria-live="polite">{{ visibleError || hint }}</small>
}
